name: Build and Deploy HTML to Test

# Each PR deploys to https://test.bjrge.org/<PR number>/, and main deploys to
# https://test.bjrge.org/main/, so builds no longer overwrite each other.
# PR directories are removed by cleanup-test-pr.yml when the PR closes.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # PR number for pull requests, otherwise the branch name (normally "main").
  DEPLOY_DIR: ${{ github.event.pull_request.number || github.ref_name }}

jobs:
  build-and-deploy-to-test-dot-bjrge-dot-org:
    runs-on: ubuntu-latest
    environment:
      name: test.bjrge.org
      # Shows up as a "View deployment" button on the PR.
      url: https://test.bjrge.org/${{ github.event.pull_request.number || github.ref_name }}/
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: check deploy directory name
        # Keep a weird branch name (via workflow_dispatch) from escaping the
        # test site's directory.
        run: |
          [[ "$DEPLOY_DIR" =~ ^[A-Za-z0-9._-]+$ && "$DEPLOY_DIR" != .* ]] || {
            echo "unsafe deploy directory: $DEPLOY_DIR" >&2; exit 1; }
      - name: checkout source
        uses: actions/checkout@v6
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
          persist-credentials: false
      - name: Hugo setup
        # 3.2.1
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: 0.160.1
      - name: build site with hugo
        run: hugo --environment staging
      - name: relocate absolute URLs into the deploy directory
        # We can't just pass --baseURL https://test.bjrge.org/N/: with
        # relativeURLS, Hugo's own links (which already include /N/) get
        # rewritten relative to the site root and end up as /N/N/...  So we
        # build as if at the root, where relativeURLS works, and fix up the
        # absolute URLs the theme emits.  Only HTML and XML contain the host;
        # CSS/JS are left alone so their integrity hashes stay valid.
        run: |
          find public -type f \( -name '*.html' -o -name '*.xml' \) -print0 |
            xargs -0 sed -i "s#https://test\.bjrge\.org/#https://test.bjrge.org/${DEPLOY_DIR}/#g"
      - name: list public directory
        run: find public -type f
      - name: rsync 'public' to test host
        uses: burnett01/rsync-deployments@7.0.1
        with:
          path: public/
          remote_host: ${{ secrets.HOST }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_path: /home/timshow/test.bjrge.org/${{ env.DEPLOY_DIR }}/
          remote_user: ${{ secrets.USER }}
          switches: -vzr --delete
