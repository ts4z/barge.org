name: do-not-merge check

# Sets a `do-not-merge` commit status on the PR's head commit: pending while
# the PR carries the `do-not-merge` label, success otherwise.  This only blocks
# merging if the "do-not-merge" status is marked required for main in the
# repository's branch protection (or ruleset) settings.
#
# We set a status rather than failing the job so nobody gets "Run failed"
# emails.  The job must not be named do-not-merge, or its always-successful
# check run would satisfy the required check by itself.

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, reopened, synchronize, labeled, unlabeled ]

jobs:
  set-do-not-merge-status:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: set do-not-merge status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-merge') }}
        run: |
          if [ "$LABELED" = true ]; then
            state=pending
            description="This PR is labeled do-not-merge.  (Remove the label to pass this check.)"
          else
            state=success
            description="No do-not-merge label."
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$state" -f context=do-not-merge -f description="$description"
